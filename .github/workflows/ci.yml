name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer (lint)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Warning,Error
          if ($issues) {
            $issues | Format-Table -AutoSize
            Write-Error "Lint found $($issues.Count) issue(s)."
            exit 1
          }
          Write-Host "Lint clean."

      - name: Run Pester (tests)
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) test(s) failed."
            exit 1
          }
          Write-Host "All $($result.PassedCount) test(s) passed."
